<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NUCtool</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #f8fafc;
      font-family: "Fira Sans", "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background:
        linear-gradient(90deg, rgba(56, 189, 248, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(56, 189, 248, 0.06) 1px, transparent 1px),
        linear-gradient(135deg, #020617, #08111f);
      background-size: 36px 36px, 36px 36px, 100% 100%;
      overflow: hidden;
    }
    .splash {
      width: min(360px, calc(100vw - 40px));
      border: 1px solid #22304a;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      padding: 22px;
    }
    .mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(34, 197, 94, 0.46);
      border-radius: 8px;
      background: rgba(34, 197, 94, 0.16);
      color: #22c55e;
      margin-bottom: 16px;
    }
    .mark svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
    }
    p {
      margin: 8px 0 18px;
      color: #aebbd0;
      font-size: 13px;
      line-height: 1.6;
    }
    .bar {
      height: 6px;
      border-radius: 999px;
      background: #17233a;
      overflow: hidden;
    }
    .bar::before {
      content: "";
      display: block;
      height: 100%;
      width: 38%;
      border-radius: inherit;
      background: linear-gradient(90deg, #22c55e, #38bdf8);
      animation: load 1.3s ease-in-out infinite alternate;
    }
    @keyframes load {
      from { transform: translateX(-20%); }
      to { transform: translateX(180%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar::before { animation: none; transform: translateX(80%); }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="m13 2-2 8h7l-8 12 2-8H5z"/></svg>
    </div>
    <h1>NUCtool</h1>
    <p>正在初始化硬件监控与风扇控制服务。</p>
    <div class="bar" aria-hidden="true"></div>
  </div>
</body>
</html>
